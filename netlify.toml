# Netlify: Nuxt tự chọn preset Nitro "netlify" khi build trên Netlify.
# Biến môi trường NUXT_* khai báo trong Netlify UI (Site configuration > Environment variables).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Các biến NUXT_PUBLIC_* là cấu hình client (Firebase web config, khóa VAPID công khai):
  # bắt buộc nằm trong bundle gửi tới trình duyệt, bảo mật dựa vào Firestore rules. Bỏ qua khi quét bí mật.
  # Các bí mật thật (NUXT_FIREBASE_SERVICE_ACCOUNT, NUXT_VAPID_PRIVATE_KEY, NUXT_CRON_SECRET) vẫn được quét.
  SECRETS_SCAN_OMIT_KEYS = "NUXT_PUBLIC_FIREBASE_API_KEY,NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NUXT_PUBLIC_FIREBASE_PROJECT_ID,NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NUXT_PUBLIC_FIREBASE_APP_ID,NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NUXT_PUBLIC_VAPID_PUBLIC_KEY"

# Scheduled Function gửi nhắc đẩy mỗi phút (netlify/functions/reminders.mts).
# Cần: NUXT_FIREBASE_SERVICE_ACCOUNT, NUXT_PUBLIC_VAPID_PUBLIC_KEY, NUXT_VAPID_PRIVATE_KEY, NUXT_VAPID_SUBJECT.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
